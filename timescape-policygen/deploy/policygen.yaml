# Deploy the policy generator into the install cluster, alongside Timescape so it
# can reach ClickHouse over the in-cluster Service. Read-only: it only SELECTs
# from hubble.flows and never touches the cluster API — generated CNPs are handed
# to the user as YAML to apply manually (audit-mode first).
#
#   oc apply -f deploy/policygen.yaml
#   oc -n hubble-timescape-install get route timescape-policygen
apiVersion: v1
kind: Namespace
metadata:
  name: timescape-policygen
---
# CH creds: reuse the read-path user the Timescape server itself uses
# (`timescape_server`). The `default` user requires a password over the network
# (only trusted on localhost), so we authenticate as timescape_server and read its
# password from the chart-managed secret via a projected env (see Deployment).
# This keeps the generator read-only with the same grants the UI/server have.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescape-policygen
  namespace: timescape-policygen
  labels: { app: timescape-policygen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: timescape-policygen }
  template:
    metadata:
      labels: { app: timescape-policygen }
    spec:
      containers:
        - name: policygen
          # « CHANGE » to the image you built/pushed to the lab registry.
          image: artifactory.ocp-migrate.md.prglab.local:8443/timescape-policygen:0.1
          ports:
            - containerPort: 8080
          env:
            - name: CH_ADDR
              value: clickhouse-hubble-timescape.hubble-timescape-install.svc.cluster.local:9000
            - name: CH_DATABASE
              value: hubble
            - name: CH_USER
              value: timescape_server
            - name: CH_PASSWORD
              valueFrom:
                # Copied from hubble-timescape-install/hubble-timescape-server-creds
                # (secrets can't be referenced cross-namespace). Re-copy if rotated:
                #   oc get secret hubble-timescape-server-creds -n hubble-timescape-install -o json \
                #     | jq '.metadata.namespace="timescape-policygen"|.metadata.name="policygen-ch"|del(.metadata.uid,.metadata.resourceVersion,.metadata.creationTimestamp)' \
                #     | oc apply -f -
                secretKeyRef: { name: policygen-ch, key: CLICKHOUSE_PASSWORD }
          readinessProbe:
            httpGet: { path: /api/healthz, port: 8080 }
            initialDelaySeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: timescape-policygen
  namespace: timescape-policygen
spec:
  selector: { app: timescape-policygen }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: timescape-policygen
  namespace: timescape-policygen
spec:
  to: { kind: Service, name: timescape-policygen }
  port: { targetPort: http }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
